<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Planner · 25 Years of Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fbf6f0; --ink: #3b3340; --soft: #8a7f8c;
    --blush: #e9a8b4; --blush-deep: #c96f83; --blush-pale: #f7e6ea;
    --silver: #b9bcc4; --silver-deep: #8d919c; --line: #eee4e7; --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: "Inter", system-ui, sans-serif; line-height: 1.5; min-height: 100vh; }
  .bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(60vmax 50vmax at 10% 10%, #f7dfe4 0%, transparent 60%),
      radial-gradient(60vmax 50vmax at 90% 90%, #e6e8ee 0%, transparent 60%);
  }
  .wrap { position: relative; z-index: 1; }
  a.home { position: fixed; top: 16px; left: 16px; z-index: 2; text-decoration: none; color: var(--ink); background: rgba(255,255,255,.85); border: 1px solid #e8dfe3; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 500; }
  a.home:hover { background: #fff; }


  /* planner */
  .planner { max-width: 1040px; margin: 0 auto; padding: 72px 24px 80px; }
  header.top { text-align: center; margin-bottom: 36px; }
  .eyebrow { font-family: "Caveat", cursive; font-size: 30px; color: var(--blush-deep); }
  header.top h1 { font-family: "Fraunces", serif; font-weight: 600; font-size: clamp(38px, 6vw, 64px); line-height: 1.05; }
  header.top .summary { color: var(--soft); max-width: 680px; margin: 14px auto 0; font-size: 17px; }

  .tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 28px; position: sticky; top: 0; padding: 12px 0; z-index: 1; background: linear-gradient(var(--paper) 70%, transparent); }
  .tabs button { font: 500 14px "Inter", sans-serif; padding: 8px 16px; border-radius: 999px; border: 1px solid #e8dfe3; background: rgba(255,255,255,.85); color: var(--ink); cursor: pointer; }
  .ver-toggle { display: inline-flex; border: 1px solid #e8dfe3; border-radius: 999px; padding: 3px; margin: 0 0 16px; background: rgba(255,255,255,.85); }
  .ver-toggle button { font: 500 13px "Inter", sans-serif; padding: 6px 14px; border: 0; border-radius: 999px; background: none; color: var(--ink); cursor: pointer; }
  .ver-toggle button.on { background: var(--blush-deep); color: #fff; }
  .tabs button.on { background: var(--blush-deep); border-color: var(--blush-deep); color: #fff; }

  section.panel { background: var(--card); border-radius: 20px; padding: 28px; box-shadow: 0 14px 40px rgba(59, 51, 64, .08); margin-bottom: 22px; }
  section.panel h2 { font-family: "Fraunces", serif; font-weight: 600; font-size: 28px; margin-bottom: 14px; }
  .glance { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .glance div { background: var(--blush-pale); border-radius: 14px; padding: 16px; }
  .glance b { display: block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--blush-deep); margin-bottom: 4px; }

  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: left; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--silver-deep); font-weight: 600; padding: 8px 12px; border-bottom: 2px solid var(--line); }
  td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.time { white-space: nowrap; font-weight: 600; color: var(--blush-deep); }
  td.seg { font-weight: 600; }
  td.len, td.who { white-space: nowrap; color: var(--soft); }
  .secret-form input { font: 15px "Inter", sans-serif; padding: 8px 12px; border: 1px solid #e3d8dc; border-radius: 10px; }
  .secret-form button { font: 600 14px "Inter", sans-serif; padding: 8px 14px; border: 0; border-radius: 10px; background: var(--blush-deep); color: #fff; cursor: pointer; }
  .secret-err { color: var(--blush-deep); font-size: 14px; margin-left: 8px; }
  .shoe-qs { padding-left: 1.4em; line-height: 1.9; }
  .spk { color: var(--blush-deep); font-weight: 600; }
  td.resp { min-width: 220px; font-size: 14px; color: var(--soft); }
  .tbd { color: var(--silver-deep); font-style: italic; }
  .film { color: var(--soft); font-size: 13px; }
  tr.open td { background: repeating-linear-gradient(135deg, #fdf8f9 0 10px, #f9eff2 10px 20px); color: var(--soft); font-style: italic; }
  tr.open td.seg::after { content: "Open slot"; display: inline-block; margin-left: 8px; font: 600 10px "Inter", sans-serif; font-style: normal; letter-spacing: .1em; text-transform: uppercase; color: var(--blush-deep); border: 1px dashed var(--blush); border-radius: 999px; padding: 1px 8px; vertical-align: 2px; }

  .cue { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .cue:last-child { border-bottom: 0; }
  .cue-time { font-weight: 600; color: var(--blush-deep); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
  .cue p { margin: 6px 0; font-size: 16px; }
  .cue p.note-line { color: var(--soft); font-style: italic; font-size: 14px; }

  ul.todo { list-style: none; }
  ul.todo li { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  ul.todo li:last-child { border-bottom: 0; }
  ul.todo .box { flex: 0 0 22px; height: 22px; border-radius: 6px; border: 2px solid var(--silver); display: grid; place-items: center; color: #fff; font-size: 14px; margin-top: 1px; }
  ul.todo li.done .box { background: var(--blush-deep); border-color: var(--blush-deep); }
  ul.todo li.done .task { color: var(--soft); text-decoration: line-through; }
  ul.todo .by { font-weight: 600; white-space: nowrap; min-width: 84px; }

  .table-scroll { overflow-x: auto; }
  .hidden { display: none !important; }
  .foot { text-align: center; margin-top: 28px; }
  .foot button { font: 500 13px "Inter", sans-serif; background: none; border: 0; color: var(--soft); text-decoration: underline; cursor: pointer; }

  @media (max-width: 640px) {
    section.panel { padding: 20px 16px; }
    td, th { padding: 10px 8px; }
  }
  @media print {
    .bg, a.home, .tabs, .foot { display: none !important; }
    section.panel { box-shadow: none; border: 1px solid var(--line); break-inside: avoid; }
    section.panel.hidden { display: block !important; }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <a class="home" href="./">⌂ Home</a>

  <div class="wrap">

    <div class="planner" id="planner"></div>
  </div>

  <script>
  (function () {
    var out = document.getElementById("planner");

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }
    function val(s) { return /^\s*(tbd)?\s*$/i.test(s || "") ? '<span class="tbd">TBD</span>' : esc(s); }

    function load() {
      var s = document.createElement("script");
      s.src = "planner.js?v=" + Date.now(); // always fetch the latest plan, never a cached copy
      s.onload = function () { render(window.PLAN); };
      s.onerror = function () { out.textContent = "Couldn't load the plan. Try refreshing."; };
      document.body.appendChild(s);
    }

    var sections = [
      { id: "overview", label: "Overview" },
      { id: "run", label: "Run of show" },
      { id: "perf", label: "Performances" },
      { id: "music", label: "Music cues" },
      { id: "script", label: "Emcee script" },
      { id: "secret", label: "Game questions 🔒" },
      { id: "roles", label: "Who does what" },
      { id: "todo", label: "Prep timeline" },
    ];

    function render(p) {
      var html = '<header class="top"><p class="eyebrow">' + esc(p.date) + '</p><h1>' + esc(p.title) + '</h1>' +
        '<p class="summary">' + esc(p.summary) + '</p></header>';

      html += '<nav class="tabs" id="tabs"><button data-tab="all" class="on">Everything</button>' +
        sections.map(function (s) { return '<button data-tab="' + s.id + '">' + s.label + '</button>'; }).join("") + '</nav>';

      html += panel("overview", "At a glance",
        '<div class="glance">' + (p.glance || []).map(function (g) {
          return '<div><b>' + esc(g.label) + '</b>' + esc(g.text) + '</div>';
        }).join("") + '</div>');

      html += panel("run", "Run of show", table(["Time", "Segment", "What happens", "Length", "Responsible"], p.runOfShow, function (r) {
        return '<td class="time">' + esc(r.time) + '</td><td class="seg">' + esc(r.segment) + '</td><td>' + esc(r.what) + '</td><td class="len">' + esc(r.length) + '</td><td class="resp">' + val(r.who) + '</td>';
      }));

      html += panel("perf", "Performances", table(["Chapter", "Act", "Song", "Performed by"], p.performances, function (r) {
        return '<td class="seg">' + esc(r.chapter) + '</td><td>' + esc(r.act) + '</td><td>' + val(r.song) + (r.film ? '<div class="film">' + esc(r.film) + '</div>' : "") +
          '</td><td class="who">' + val(r.who) + '</td>';
      }));

      html += panel("music", "Music cues", table(["Cue", "Track", "Notes"], p.music, function (r) {
        return '<td class="seg">' + esc(r.cue) + '</td><td>' + val(r.track) + '</td><td class="film">' + esc(r.note) + '</td>';
      }));

      function cues(list) {
        return (list || []).map(function (c) {
          return '<div class="cue"><div class="cue-time">' + esc(c.cue) + '</div>' + (c.lines || []).map(function (l) {
            return /^\[.*\]$/.test(l) ? '<p class="note-line">' + esc(l.slice(1, -1)) + '</p>' : (/^(Samyak|Anshi|Both|Guest|Uncle|Ajai Fufaji):\s*/.test(l) ? '<p><b class="spk">' + esc(l.split(":")[0] === "Guest" ? "Guest emcee" : l.split(":")[0]) + ':</b> ' + esc(l.replace(/^[^:]+:\s*/, "")) + '</p>' : '<p>' + esc(l) + '</p>');
          }).join("") + '</div>';
        }).join("");
      }
      var vers = [["v1", "v1 · original", p.script], ["v2", "v2", p.scriptV2], ["v3", "v3 · more Hindi", p.scriptV3]].filter(function (x) { return x[2]; });
      var ver = vers[vers.length - 1][0];
      try { var saved = localStorage.getItem("emceeScriptVer"); if (saved && vers.some(function (x) { return x[0] === saved; })) ver = saved; } catch (e) {}
      html += panel("script", "Emcee script", '<p class="film" style="margin-bottom:10px">What the hosts say, in order. Samyak and Anshi take turns. In v2 and v3 Ajai Fufaji introduces Samyak&#39;s dance and Samyak introduces Anshi &amp; Yashi&#39;s. Lines in [brackets] are notes or names to fill in.</p>' +
        (vers.length > 1 ? '<div class="ver-toggle" id="verToggle" role="group" aria-label="Script version">' +
          vers.map(function (x) { return '<button data-ver="' + x[0] + '"' + (ver === x[0] ? ' class="on"' : '') + '>' + x[1] + '</button>'; }).join("") + '</div>' : '') +
        vers.map(function (x) { return '<div class="script-ver" data-ver="' + x[0] + '"' + (ver === x[0] ? '' : ' hidden') + '>' + cues(x[2]) + '</div>'; }).join(""));

      html += panel("roles", "Who does what", table(["Role", "Responsibilities", "Who"], p.roles, function (r) {
        return '<td class="seg">' + esc(r.role) + '</td><td>' + esc(r.does) + '</td><td class="who">' + val(r.who) + '</td>';
      }));

      html += panel("todo", "Prep timeline", '<ul class="todo">' + (p.timeline || []).map(function (t) {
        return '<li class="' + (t.done ? "done" : "") + '"><span class="box">' + (t.done ? "✓" : "") + '</span>' +
          '<span class="by">' + esc(t.by) + '</span><span class="task">' + esc(t.task) + '</span></li>';
      }).join("") + '</ul>');

      html += panel("secret", "Tie & Flower game questions", '<div id="secretBox"><p class="film" style="margin-bottom:10px">These are hidden so they stay a surprise. Enter the password to see them.</p>' +
        '<form id="secretForm" class="secret-form" autocomplete="off"><input type="password" id="secretPw" placeholder="Password" aria-label="Password"> <button type="submit">Unlock</button> <span id="secretErr" class="secret-err"></span></form></div>');

      out.innerHTML = html;
      wireSecret(p.shoeSecret);

      var vt = document.getElementById("verToggle");
      if (vt) vt.addEventListener("click", function (e) {
        var b = e.target.closest("button"); if (!b) return;
        var v = b.getAttribute("data-ver");
        Array.prototype.forEach.call(vt.children, function (x) { x.classList.toggle("on", x === b); });
        Array.prototype.forEach.call(out.querySelectorAll(".script-ver"), function (d) { d.hidden = d.getAttribute("data-ver") !== v; });
        try { localStorage.setItem("emceeScriptVer", v); } catch (err) {}
      });

      document.getElementById("tabs").addEventListener("click", function (e) {
        var b = e.target.closest("button"); if (!b) return;
        var tab = b.getAttribute("data-tab");
        Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle("on", x === b); });
        Array.prototype.forEach.call(out.querySelectorAll("section.panel"), function (s) {
          s.classList.toggle("hidden", tab !== "all" && s.id !== tab);
        });
      });
    }

    function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
    function wireSecret(sec) {
      var form = document.getElementById("secretForm");
      if (!form || !sec) return;
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var err = document.getElementById("secretErr"); err.textContent = "";
        if (!window.crypto || !crypto.subtle) { err.textContent = "Open this page over https to unlock."; return; }
        var pw = document.getElementById("secretPw").value.trim();
        crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (base) {
          return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(sec.salt), iterations: 200000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        }).then(function (key) {
          return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(sec.iv) }, key, b64(sec.data));
        }).then(function (buf) {
          var qs = JSON.parse(new TextDecoder().decode(buf));
          document.getElementById("secretBox").innerHTML = '<ol class="shoe-qs">' + qs.map(function (q) { return '<li>' + esc(q) + '</li>'; }).join("") + '</ol>';
        }).catch(function () { err.textContent = "That's not it. Try again!"; });
      });
    }

    function panel(id, title, body) { return '<section class="panel" id="' + id + '"><h2>' + esc(title) + '</h2>' + body + '</section>'; }
    function table(heads, rows, row) {
      return '<div class="table-scroll"><table><thead><tr>' + heads.map(function (h) { return '<th>' + h + '</th>'; }).join("") +
        '</tr></thead><tbody>' + (rows || []).map(function (r) { return '<tr' + (r.open ? ' class="open"' : '') + '>' + row(r) + '</tr>'; }).join("") + '</tbody></table></div>';
    }

    load();
  })();
  </script>
</body>
</html>
