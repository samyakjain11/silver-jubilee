<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>25 Years of Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fbf6f0; --ink: #3b3340; --soft: #8a7f8c;
    --blush: #e9a8b4; --blush-deep: #c96f83;
    --silver: #b9bcc4; --silver-deep: #8d919c; --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 6vh 6vw; overflow-x: hidden;
  }
  .bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(60vmax 50vmax at 10% 10%, #f7dfe4 0%, transparent 60%),
      radial-gradient(60vmax 50vmax at 90% 90%, #e6e8ee 0%, transparent 60%);
  }
  .heart { position: fixed; bottom: -40px; z-index: 0; pointer-events: none; color: var(--blush); opacity: .35; animation: float linear infinite; }
  @keyframes float { to { transform: translateY(-115vh) rotate(25deg); } }

  main { position: relative; z-index: 1; text-align: center; max-width: 960px; width: 100%; }
  .rings svg { width: 96px; height: 60px; }
  h1 {
    font-family: "Fraunces", serif; font-weight: 600;
    font-size: clamp(44px, 8vw, 110px); line-height: 1.02; letter-spacing: -0.02em;
  }
  h1 .silver {
    background: linear-gradient(100deg, var(--silver-deep), #e9eaee 45%, var(--silver-deep) 90%);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 6s ease-in-out infinite;
  }
  @keyframes shine { 50% { background-position: 100% 0; } }
  .sub { font-family: "Fraunces", serif; font-style: italic; font-size: clamp(18px, 2.2vw, 28px); color: var(--soft); margin-top: .5em; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 7vh; }
  .choice {
    display: block; text-decoration: none; color: var(--ink);
    background: var(--card); border-radius: 22px; padding: 36px 28px;
    box-shadow: 0 20px 50px rgba(59, 51, 64, .12);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .choice:hover, .choice:focus-visible { transform: translateY(-4px); box-shadow: 0 26px 60px rgba(59, 51, 64, .18); outline: none; }
  .choice .icon { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; background: #f7e6ea; color: var(--blush-deep); }
  .choice .icon svg { width: 26px; height: 26px; }
  .choice h2 { font-family: "Fraunces", serif; font-weight: 600; font-size: clamp(28px, 3.2vw, 40px); }
  .choice p { color: var(--soft); margin-top: .5em; line-height: 1.5; }
  .choice .tag { display: inline-block; margin-top: 14px; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--silver-deep); }
  .note { margin-top: 5vh; font-size: 13px; letter-spacing: .25em; text-transform: uppercase; color: var(--silver-deep); }

  @media (max-width: 640px) { .choices { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .heart { display: none; } h1 .silver { animation: none; } .choice { transition: none; } }
</style>
</head>
<body>
  <div class="bg"></div>
  <main>
    <div class="rings"><svg viewBox="0 0 64 40" fill="none" stroke-width="3.5" aria-hidden="true"><circle cx="24" cy="22" r="14" stroke="var(--silver-deep)"/><circle cx="40" cy="22" r="14" stroke="var(--blush-deep)"/></svg></div>
    <h1><span class="silver">25</span> Years of Us</h1>
    <p class="sub">Mom &amp; Dad's Silver Jubilee</p>

    <nav class="choices">
      <a class="choice" href="presentation.html">
        <div class="icon"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></div>
        <h2>Presentation</h2>
        <p>The photo slideshow for the big screen.</p>
        <span class="tag">For the party</span>
      </a>
      <a class="choice" href="planner.html">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
        <h2>Planner</h2>
        <p>Run of show, performances, music and to-dos.</p>
        <span class="tag">Password needed</span>
      </a>
    </nav>

    <p class="note">27 November 2026</p>
  </main>

  <script>
    var heartSvg = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>';
    for (var h = 0; h < 12; h++) {
      var heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = heartSvg;
      var size = 10 + Math.random() * 18;
      heart.style.width = heart.style.height = size + "px";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 14 + Math.random() * 16 + "s";
      heart.style.animationDelay = -Math.random() * 30 + "s";
      document.body.appendChild(heart);
    }
  </script>
</body>
</html>
