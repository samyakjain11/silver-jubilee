<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>25 Years of Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fbf6f0;
    --ink: #3b3340;
    --soft: #8a7f8c;
    --blush: #e9a8b4;
    --blush-deep: #c96f83;
    --silver: #b9bcc4;
    --silver-deep: #8d919c;
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    cursor: default;
  }

  /* soft background glow + floating hearts */
  .bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(60vmax 50vmax at 10% 10%, #f7dfe4 0%, transparent 60%),
      radial-gradient(60vmax 50vmax at 90% 90%, #e6e8ee 0%, transparent 60%);
  }
  .heart {
    position: fixed; bottom: -40px; z-index: 0; pointer-events: none;
    color: var(--blush); opacity: .35;
    animation: float linear infinite;
  }
  @keyframes float {
    to { transform: translateY(-115vh) rotate(25deg); }
  }

  /* slides: big text, no frames, photos fill the screen */
  .deck { position: relative; z-index: 1; height: 100%; touch-action: pan-y pinch-zoom; }
  .slide {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 2vh 2vw;
    opacity: 0; visibility: hidden;
    transform: scale(.98);
    transition: opacity .9s ease, transform .9s ease, visibility .9s;
  }
  .slide.active { opacity: 1; visibility: visible; transform: none; }

  .center { text-align: center; max-width: 96vw; }
  .eyebrow {
    font-family: "Caveat", cursive; font-size: clamp(30px, 5.2vw, 96px);
    color: var(--blush-deep);
  }
  h1 {
    font-family: "Fraunces", serif; font-weight: 600;
    font-size: clamp(54px, 14vw, 280px); line-height: 1.02;
    letter-spacing: -0.02em;
  }
  h1 .silver {
    background: linear-gradient(100deg, var(--silver-deep), #e9eaee 45%, var(--silver-deep) 90%);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 6s ease-in-out infinite;
  }
  @keyframes shine { 50% { background-position: 100% 0; } }
  h2 {
    font-family: "Fraunces", serif; font-weight: 600;
    font-size: clamp(46px, 11vw, 220px); line-height: 1.04;
  }
  .sub {
    font-family: "Fraunces", serif; font-style: italic;
    font-size: clamp(24px, 4vw, 76px); color: var(--soft); margin-top: .5em;
  }
  .note {
    margin-top: 1.6em; font-size: clamp(16px, 2.2vw, 40px);
    letter-spacing: .25em; text-transform: uppercase; color: var(--silver-deep);
  }
  .rings { font-size: clamp(44px, 7vw, 130px); margin-bottom: .1em; }
  .rings svg { width: 1.6em; height: 1em; }

  .divider {
    width: 16vw; height: 3px; margin: 1em auto 0;
    background: linear-gradient(90deg, transparent, var(--silver), transparent);
  }

  /* photo slide: one big photo, no frame, never cropped */
  .photo-wrap { display: flex; align-items: center; gap: 3vw; width: 100%; height: 100%; justify-content: center; }
  .polaroid { position: relative; flex: 0 0 auto; margin: 0; }
  .polaroid img, .polaroid .ph {
    display: block;
    height: 92vh; width: auto; max-width: 64vw;
    object-fit: contain;
  }
  .polaroid .ph {
    aspect-ratio: 4 / 5;
    background:
      repeating-linear-gradient(45deg, #f4eef0 0 14px, #faf6f7 14px 28px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--soft); font-family: "Caveat", cursive; font-size: 40px; gap: 8px;
  }
  .polaroid .ph svg { width: 70px; height: 70px; color: var(--blush); }
  .polaroid .scrawl, .tape { display: none; }

  /* collage slide: 2 to 4 photos, as big as fits, never cropped */
  .collage { display: flex; flex-direction: column; align-items: center; gap: 1.5vh; width: 100%; height: 100%; }
  .collage h3 { flex: 0 0 auto; font-family: "Fraunces", serif; font-weight: 600; font-size: clamp(32px, 5.4vw, 110px); line-height: 1.05; text-align: center; }
  .collage .cdetail { flex: 0 0 auto; color: var(--soft); font-size: clamp(18px, 2.2vw, 40px); margin-top: -1vh; text-align: center; }
  .collage .grid { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; justify-content: center; align-items: center; gap: 1.2vw; }
  .collage .polaroid { height: 100%; display: flex; align-items: center; justify-content: center; min-width: 0; }
  .collage .polaroid img { height: 100%; width: auto; max-width: 100%; object-fit: contain; }
  .collage.n2 .polaroid { max-width: calc((96vw - 1.2vw) / 2); }
  .collage.n3 .polaroid { max-width: calc((96vw - 2.4vw) / 3); }
  .collage.n4 .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 1.2vh 1.2vw; }
  .collage.n4 .polaroid { width: 100%; }
  .collage.n4 .polaroid:nth-child(odd) { justify-content: flex-end; }
  .collage.n4 .polaroid:nth-child(even) { justify-content: flex-start; }
  .photo-text { max-width: 30vw; }
  .photo-text h3 {
    font-family: "Fraunces", serif; font-weight: 600;
    font-size: clamp(34px, 5vw, 104px); line-height: 1.08;
  }
  .photo-text p { font-size: clamp(18px, 2.4vw, 46px); color: var(--soft); margin-top: .6em; line-height: 1.4; }

  /* quote + message */
  blockquote {
    font-family: "Fraunces", serif; font-style: italic;
    font-size: clamp(34px, 6.4vw, 130px); line-height: 1.18; max-width: 94vw;
  }
  .by { font-family: "Caveat", cursive; font-size: clamp(30px, 4.6vw, 90px); color: var(--blush-deep); margin-top: .6em; }
  .card {
    position: relative; text-align: center; max-width: 94vw;
  }
  .card .msg { font-family: "Caveat", cursive; font-size: clamp(36px, 6.4vw, 130px); line-height: 1.2; }
  .card .from { margin-top: 1em; letter-spacing: .2em; text-transform: uppercase; font-size: clamp(16px, 2.2vw, 40px); color: var(--silver-deep); }
  .card .mark { display: none; }

  /* video slide: fills the screen, never cropped, native controls */
  .video-wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .video-wrap video { display: block; width: 100%; height: 100%; max-height: 96vh; object-fit: contain; background: #000; outline: none; }
  .video-wrap .play-big {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: clamp(90px, 12vw, 200px); height: clamp(90px, 12vw, 200px); border-radius: 50%;
    border: 0; background: rgba(201,111,131,.88); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 40px rgba(0,0,0,.25);
  }
  .video-wrap .play-big svg { width: 45%; height: 45%; margin-left: 8%; }
  .video-wrap.playing .play-big { display: none; }

  /* controls */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 22px; opacity: 0; transition: opacity .4s;
  }
  body.show-ui .bar, .bar:hover { opacity: 1; }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--silver); border: 0; cursor: pointer; }
  .dot.on { background: var(--blush-deep); transform: scale(1.3); }
  .btn {
    background: rgba(255,255,255,.8); border: 1px solid #e8dfe3; color: var(--ink);
    border-radius: 999px; padding: 8px 14px; font: 500 13px "Inter", sans-serif; cursor: pointer;
  }
  .btn:hover { background: #fff; }
  a.btn { text-decoration: none; }
  .progress { position: fixed; top: 0; left: 0; height: 3px; background: var(--blush); z-index: 3; width: 0; }
  .progress.run { transition: width linear; }
  .hint { color: var(--soft); font-size: 12px; white-space: nowrap; }

  @media (max-width: 760px) {
    .photo-wrap { flex-direction: column; gap: 2vh; text-align: center; }
    .polaroid img, .polaroid .ph { height: auto; max-height: 62vh; max-width: 96vw; }
    .photo-text { max-width: 96vw; }
    .collage .grid { flex-direction: column; gap: 1.2vh; }
    .collage .polaroid, .collage.n2 .polaroid, .collage.n3 .polaroid { max-width: 96vw; min-height: 0; flex: 1 1 0; height: auto; width: 100%; }
    .collage.n4 .grid { display: flex; }
    .collage.n4 .polaroid { justify-content: center !important; }
    .hint { display: none; }
    .dots { display: none; }
    .bar { padding: 10px 12px; gap: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .heart { display: none; }
    .slide { transition: opacity .3s; transform: none; }
    h1 .silver { animation: none; }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="progress" id="progress"></div>
  <main class="deck" id="deck"></main>

  <div class="bar">
    <button class="btn" id="play">▶ Autoplay</button>
    <div class="dots" id="dots"></div>
    <a class="btn" href="./" onclick="event.stopPropagation()">⌂ Home</a>
    <span class="hint">← → to move · F fullscreen</span>
    <button class="btn" id="full">⛶ Fullscreen</button>
  </div>

  <script src="slides.js"></script>
  <script>
  (function () {
    var show = window.SHOW;
    var deck = document.getElementById("deck");
    var dotsEl = document.getElementById("dots");
    var progress = document.getElementById("progress");
    var playBtn = document.getElementById("play");
    var heartSvg = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>';
    var ringsSvg = '<svg viewBox="0 0 64 40" fill="none" stroke="currentColor" stroke-width="3.5" aria-hidden="true" style="color:var(--silver-deep)"><circle cx="24" cy="22" r="14"/><circle cx="40" cy="22" r="14" style="color:var(--blush-deep)" stroke="var(--blush-deep)"/></svg>';

    function esc(s) {
      return String(s || "").replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }

    function render(s) {
      switch (s.type) {
        case "title":
          return '<div class="center"><div class="rings">' + ringsSvg + '</div>' +
            '<h1>' + esc(s.title).replace(/(25(th)?)/, '<span class="silver">$1</span>') + '</h1>' +
            '<p class="sub">' + esc(s.subtitle) + '</p>' +
            (s.note ? '<p class="note">' + esc(s.note) + '</p>' : "") + '</div>';
        case "chapter":
          return '<div class="center"><p class="eyebrow">' + esc(s.number) + '</p>' +
            '<h2>' + esc(s.title) + '</h2>' +
            '<p class="sub">' + esc(s.subtitle) + '</p><div class="divider"></div></div>';
        case "photo":
          var media = s.photo
            ? '<img src="' + esc(s.photo) + '" alt="' + esc(s.caption) + '">'
            : '<div class="ph">' + heartSvg + '<span>photo coming soon</span></div>';
          return '<div class="photo-wrap"><figure class="polaroid"><span class="tape"></span>' + media +
            '<figcaption class="scrawl">' + esc(s.caption) + '</figcaption></figure>' +
            '<div class="photo-text"><h3>' + esc(s.caption) + '</h3>' +
            (s.detail ? '<p>' + esc(s.detail) + '</p>' : "") + '</div></div>';
        case "collage":
          var ps = (s.photos || []).slice(0, 4);
          return '<div class="collage n' + ps.length + '"><h3>' + esc(s.caption) + '</h3>' +
            (s.detail ? '<p class="cdetail">' + esc(s.detail) + '</p>' : "") +
            '<div class="grid">' + ps.map(function (p) {
              return '<figure class="polaroid"><img src="' + esc(p) + '" alt="' + esc(s.caption) + '" loading="lazy"></figure>';
            }).join("") + '</div></div>';
        case "quote":
          return '<div class="center"><blockquote>“' + esc(s.text) + '”</blockquote>' +
            '<p class="by">' + esc(s.by) + '</p></div>';
        case "video":
          return '<div class="video-wrap"><video src="' + esc(s.video) + '"' +
            (s.poster ? ' poster="' + esc(s.poster) + '"' : "") +
            ' controls playsinline preload="metadata" aria-label="' + esc(s.caption) + '"></video>' +
            '<button class="play-big" aria-label="Play video"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg></button></div>';
        case "message":
          return '<div class="card"><span class="mark">' + heartSvg.replace('<svg', '<svg width="20" height="20"') + '</span>' +
            '<p class="msg">' + esc(s.text) + '</p><p class="from">— ' + esc(s.from) + '</p></div>';
      }
      return "";
    }

    show.slides.forEach(function (s, i) {
      var el = document.createElement("section");
      el.className = "slide";
      el.innerHTML = render(s);
      deck.appendChild(el);
      var d = document.createElement("button");
      d.className = "dot"; d.setAttribute("aria-label", "Slide " + (i + 1));
      d.onclick = function (e) { e.stopPropagation(); go(i); };
      dotsEl.appendChild(d);
    });

    var slides = deck.children, dots = dotsEl.children, cur = 0, timer = null;

    function videoIn(i) { return slides[i] ? slides[i].querySelector("video") : null; }
    function toggleVideo(v) { if (v.paused || v.ended) v.play(); else v.pause(); }

    Array.prototype.forEach.call(deck.querySelectorAll(".video-wrap"), function (wrap) {
      var v = wrap.querySelector("video");
      // Clicks/taps on the video work its controls; they don't change slides.
      wrap.addEventListener("click", function (e) { e.stopPropagation(); });
      wrap.querySelector(".play-big").onclick = function () { v.play(); };
      v.addEventListener("play", function () { wrap.classList.add("playing"); });
      v.addEventListener("pause", function () { wrap.classList.remove("playing"); });
      v.addEventListener("ended", function () { wrap.classList.remove("playing"); });
    });

    function go(i) {
      if (i < 0 || i >= slides.length) return;
      if (timer && i === slides.length - 1) togglePlay();
      slides[cur].classList.remove("active"); dots[cur].classList.remove("on");
      var leaving = videoIn(cur);
      if (leaving) leaving.pause();
      cur = i;
      slides[cur].classList.add("active"); dots[cur].classList.add("on");
      // Start buffering a video a couple of slides early so it plays smoothly.
      for (var k = cur; k <= cur + 2 && k < slides.length; k++) {
        var near = videoIn(k);
        if (near && near.preload !== "auto") near.preload = "auto";
      }
      if (timer && videoIn(cur)) togglePlay(); // don't auto-advance past a video
      try { history.replaceState(null, "", "#" + (cur + 1)); } catch (e) {}
      if (timer) restartProgress();
    }

    function restartProgress() {
      var secs = show.autoplaySeconds || 8;
      progress.classList.remove("run"); progress.style.width = "0";
      void progress.offsetWidth;
      progress.classList.add("run");
      progress.style.transitionDuration = secs + "s";
      progress.style.width = "100%";
    }

    function togglePlay() {
      if (timer) {
        clearInterval(timer); timer = null;
        progress.classList.remove("run"); progress.style.width = "0";
        playBtn.textContent = "▶ Autoplay";
      } else {
        timer = setInterval(function () { go(cur + 1); }, (show.autoplaySeconds || 8) * 1000);
        restartProgress();
        playBtn.textContent = "❚❚ Pause";
      }
    }

    function fullscreen() {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    }

    playBtn.onclick = function (e) { e.stopPropagation(); togglePlay(); };
    document.getElementById("full").onclick = function (e) { e.stopPropagation(); fullscreen(); };

    document.addEventListener("keydown", function (e) {
      var v = videoIn(cur);
      if (v && (e.key === "Enter" || e.key === "k" || e.key === "K")) { e.preventDefault(); toggleVideo(v); return; }
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); go(cur + 1); }
      else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(cur - 1); }
      else if (e.key === "f" || e.key === "F") fullscreen();
      else if (e.key === "p" || e.key === "P") togglePlay();
      else if (e.key === "Home") go(0);
      else if (e.key === "End") go(slides.length - 1);
    });

    var lastSwipe = 0;
    deck.addEventListener("click", function (e) {
      if (Date.now() - lastSwipe < 500) return; // a swipe just moved the slide
      go(e.clientX > window.innerWidth / 3 ? cur + 1 : cur - 1);
    });

    // Swipe left = next, swipe right = previous. Ignores short, slow,
    // mostly-vertical and multi-finger (pinch) gestures.
    var tx = null, ty = 0, tt = 0;
    document.addEventListener("touchstart", function (e) {
      if (e.touches.length !== 1) { tx = null; return; }
      tx = e.touches[0].clientX; ty = e.touches[0].clientY; tt = Date.now();
    }, { passive: true });
    document.addEventListener("touchmove", function (e) {
      if (e.touches.length !== 1) tx = null;
    }, { passive: true });
    document.addEventListener("touchend", function (e) {
      if (tx === null) return;
      var t = e.changedTouches[0];
      var dx = t.clientX - tx, dy = t.clientY - ty;
      tx = null;
      if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5 || Date.now() - tt > 1000) return;
      lastSwipe = Date.now();
      go(dx < 0 ? cur + 1 : cur - 1);
    }, { passive: true });
    document.addEventListener("touchcancel", function () { tx = null; }, { passive: true });

    var hideTimer;
    document.addEventListener("mousemove", function () {
      document.body.classList.add("show-ui");
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function () { document.body.classList.remove("show-ui"); }, 2200);
    });

    // floating hearts
    for (var h = 0; h < 14; h++) {
      var heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = heartSvg;
      var size = 10 + Math.random() * 18;
      heart.style.width = heart.style.height = size + "px";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 14 + Math.random() * 16 + "s";
      heart.style.animationDelay = -Math.random() * 30 + "s";
      document.body.appendChild(heart);
    }

    var start = parseInt((location.hash || "").slice(1), 10);
    slides[0].classList.add("active"); dots[0].classList.add("on");
    if (start > 1 && start <= slides.length) go(start - 1);
  })();
  </script>
</body>
</html>
